# .github/workflows/terraform-qa.yml
#
# Runs on every PR against main. Creates/updates an EPHEMERAL, per-PR QA
# environment, then destroys it automatically when the PR closes (merged or
# not). Never touches production. Uses OIDC/WIF -- no long-lived GCP key is
# ever stored as a GitHub secret.

name: Terraform QA (ephemeral per-PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write   # required for OIDC -> WIF
  pull-requests: write # required to comment plan/cost output on the PR

env:
  TF_VERSION: "1.15.8"
  PROJECT_ID: "testing-project-499604"
  REGION: "asia-south1"
  # Unique per PR -- this is the state-isolation mechanism (section 15/16):
  # each PR gets its own prefix inside the shared state bucket, so
  # concurrent PRs can never collide or overwrite each other's state.
  TF_ENVIRONMENT: "qa-pr-${{ github.event.pull_request.number }}"
  STATE_PREFIX: "ephemeral/pr-${{ github.event.pull_request.number }}"

jobs:
  plan-and-apply:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (ephemeral state prefix)
        run: |
          terraform init \
            -backend-config="bucket=testing-project-499604-tf-state" \
            -backend-config="prefix=${{ env.STATE_PREFIX }}"

      - name: Terraform validate
        run: terraform validate

      - name: Fetch DB password from Secret Manager
        run: |
          echo "TF_VAR_db_password=$(gcloud secrets versions access latest --secret=db-password --project=${{ env.PROJECT_ID }})" >> "$GITHUB_ENV"

      - name: Terraform plan
        run: |
          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var-file="environments/qa/terraform.tfvars.example" \
            -out=tfplan

      - name: Checkov static security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false # a failing Checkov check blocks apply
          skip-check: CKV_GCP_62,CKV_GCP_125,CKV_GCP_41,CKV_GCP_49,CKV_GCP_6,CKV_GCP_106,CKV_GCP_2,CKV_GCP_32,CKV_GCP_39,CKV2_GCP_18

      - name: Infracost cost estimate
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: |
          infracost breakdown --path tfplan --format json --out-file infracost.json
          infracost comment github --path infracost.json \
            --repo "$GITHUB_REPOSITORY" --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --pull-request "${{ github.event.pull_request.number }}"

      - name: Terraform apply (ephemeral QA environment)
        run: terraform apply -auto-approve tfplan

  destroy-ephemeral:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (same ephemeral state prefix)
        run: |
          terraform init \
            -backend-config="bucket=testing-project-499604-tf-state" \
            -backend-config="prefix=${{ env.STATE_PREFIX }}"

      - name: Fetch DB password (needed for a clean destroy plan)
        run: |
          echo "TF_VAR_db_password=$(gcloud secrets versions access latest --secret=db-password --project=${{ env.PROJECT_ID }})" >> "$GITHUB_ENV"

      - name: Terraform destroy (tear down this PR's environment)
        run: |
          terraform destroy -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var-file="environments/qa/terraform.tfvars.example"
