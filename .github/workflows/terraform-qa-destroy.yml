name: Terraform QA Destroy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.5"
  PROJECT_ID: "testing-project-499604"
  REGION: "asia-south1"

  TF_STATE_BUCKET: "testing-project-499604-tf-state"

  TF_ENVIRONMENT: "qa-pr-${{ github.event.pull_request.number }}"

  STATE_PREFIX: "ephemeral/pr-${{ github.event.pull_request.number }}"

  DB_SECRET_NAME: "db-password"

jobs:

  # ==========================================================
  # QA DESTROY PLAN
  # ==========================================================

  destroy-plan:
    name: QA Destroy Plan
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-qa-destroy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:

      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${STATE_PREFIX}"

      - name: Terraform validate
        run: terraform validate

      - name: Fetch DB password
        shell: bash
        run: |
          DB_PASSWORD="$(gcloud secrets versions access latest \
            --secret="${DB_SECRET_NAME}" \
            --project="${PROJECT_ID}")"

          {
            echo "TF_VAR_db_password<<EOF"
            echo "${DB_PASSWORD}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Terraform destroy plan
        run: |
          terraform plan \
            -destroy \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="environment=${TF_ENVIRONMENT}" \
            -var-file="environments/qa/terraform.tfvars.example" \
            -out=destroy.tfplan

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: qa-destroy-plan-${{ github.event.pull_request.number }}
          path: destroy.tfplan
          retention-days: 3


  # ==========================================================
  # QA DESTROY APPLY
  # ==========================================================

  destroy-apply:
    name: QA Destroy Apply

    needs:
      - destroy-plan

    runs-on: ubuntu-latest

    environment:
      name: qa-destroy

    concurrency:
      group: terraform-qa-destroy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:

      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${STATE_PREFIX}"

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: qa-destroy-plan-${{ github.event.pull_request.number }}
          path: .

      - name: Terraform destroy
        run: |
          terraform apply \
            -auto-approve \
            destroy.tfplan